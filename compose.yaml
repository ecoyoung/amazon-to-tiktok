services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      BIND_ADDR: 0.0.0.0:8787
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    env_file:
      - ./backend/.env
    command: ["tunnel", "--no-autoupdate", "run"]
    network_mode: host
    depends_on:
      frontend:
        condition: service_started
    restart: unless-stopped
