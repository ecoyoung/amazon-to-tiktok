[package]
name = "amazon-tiktok-studio-api"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
axum = "0.7"
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "gzip"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "net"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
